name: integration-tests
on:
  workflow_call:
    inputs:
      enable_profiler:
        description: 'Run with profiler enabled'
        required: false
        type: boolean
        default: false
jobs:
  run-test:
    name: Integration Testing (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 600
    permissions:
      contents: write
      statuses: write
    outputs:
      has_diff: ${{ steps.compare.outputs.has_diff }}
      has_json_diff: ${{ steps.compare.outputs.has_json_diff }}
      has_plot_diff: ${{ steps.compare.outputs.has_plot_diff }}
      changed_plots: ${{ steps.compare.outputs.changed_plots }}
      profile_comparison: ${{ steps.profile_comparison.outputs.profile_comparison }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Shallow clone; master is fetched separately in the compare step
          fetch-depth: 1
      - name: Check for update-baseline label
        id: check-label
        uses: actions/github-script@v7
        with:
          script: |
            let hasLabel = false;
            if (context.eventName === 'pull_request') {
              // Labels are directly available in the PR event payload
              hasLabel = context.payload.pull_request.labels.some(
                l => l.name === 'update-baseline'
              );
            } else if (context.eventName === 'push') {
              // Post-merge push: find the PR(s) associated with this commit
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              hasLabel = prs.some(
                pr => pr.labels.some(l => l.name === 'update-baseline')
              );
            }
            core.setOutput('update_baseline', hasLabel ? 'true' : 'false');
      - name: Set up Python 3.10.17
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.17'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/constraints.txt ".[dev]" psrecord
      - name: Run and profile workflow
        env:
          ENABLE_PROFILER: ${{ inputs.enable_profiler || (github.ref == 'refs/heads/master') }}
          SOURCE_DATE_EPOCH: '0'
        run: |
          mkdir -p results
          if [[ "$ENABLE_PROFILER" == 'true' ]]; then
            steps=("ecm_prep" "run")

            # --- Profile FEATURE branch ---
            for step in "${steps[@]}"; do
              psrecord --log "memory_log_${step}_feature.txt" --include-children --interval 1 \
                "python tests/integration_testing/run_workflow.py --run_step $step --yaml tests/integration_testing/integration_test.yml --with_profiler"
              mv "results/profile_${step}.csv" "results/profile_${step}_feature.csv"
              mv "memory_log_${step}_feature.txt" "results/memory_log_${step}_feature.txt"
            done

            # --- Checkout master, on the same runner, back-to-back ---
            git fetch --depth=1 origin master
            git stash  # stash any result files to avoid conflicts
            git checkout origin/master -- .

            # Use feature branch's integration_test.yml so this is a code-only
            # comparison — otherwise master runs a lighter config and the
            # timing delta stops meaning anything.
            git fetch --depth=1 origin ${{ github.event.pull_request.head.sha || github.sha }}
            git show ${{ github.event.pull_request.head.sha || github.sha }}:tests/integration_testing/integration_test.yml > tests/integration_testing/integration_test.yml

            # Use feature branch's out_break_czones scoping fix.
            # TEMPORARY, remove once this branch merges to master. Master's
            # ecm_prep_vars.py always builds the full 50-state out_break_czones
            # breakout regardless of ecm_field_updates.climate_zone; the feature
            # branch scopes it to match. Without this overlay, master does
            # strictly more work (building/copying breakout data for 47 unused
            # states) than feature on the same yml, which conflates "less work"
            # with "faster code" in the timing comparison. This overlay is the
            # only diff between master's and feature's ecm_prep_vars.py, so it
            # doesn't pull in any of the actual perf-tuning changes being
            # profiled — it only equalizes the two branches' workload.
            git show ${{ github.event.pull_request.head.sha || github.sha }}:scout/ecm_prep_vars.py > scout/ecm_prep_vars.py

            pip install -c .github/constraints.txt ".[dev]" psrecord --quiet

            # --- Profile MASTER branch ---
            for step in "${steps[@]}"; do
              psrecord --log "memory_log_${step}_master.txt" --include-children --interval 1 \
                "python tests/integration_testing/run_workflow.py --run_step $step --yaml tests/integration_testing/integration_test.yml --with_profiler"
              mv "results/profile_${step}.csv" "results/profile_${step}_master.csv"
              mv "memory_log_${step}_master.txt" "results/memory_log_${step}_master.txt"
            done

            # --- Restore feature branch ---
            git checkout ${{ github.event.pull_request.head.sha || github.sha }} -- .
            pip install -c .github/constraints.txt ".[dev]" psrecord --quiet

            # --- Comparison ---
            echo "=== Profiling Comparison ===" | tee results/profile_comparison.txt

            for step in "${steps[@]}"; do
              echo "" | tee -a results/profile_comparison.txt
              echo "--- Step: $step ---" | tee -a results/profile_comparison.txt

              # Elapsed time = col 1 of the last data row of each psrecord memory log
              m_time=$(grep -v "^#" "results/memory_log_${step}_master.txt"  | grep -v "^$" | tail -n 1 | awk '{print $1}')
              f_time=$(grep -v "^#" "results/memory_log_${step}_feature.txt" | grep -v "^$" | tail -n 1 | awk '{print $1}')

              echo "Master  elapsed time: ${m_time}s" | tee -a results/profile_comparison.txt
              echo "Feature elapsed time: ${f_time}s" | tee -a results/profile_comparison.txt

              if [[ -n "$m_time" && -n "$f_time" ]]; then
                abs_diff=$(awk "BEGIN {printf \"%.2f\", $m_time - $f_time}")
                pct=$(awk "BEGIN {printf \"%.2f\", ($m_time - $f_time) / $m_time * 100}")
                printf "Δ Time: %ss (%.2f%% improvement in feature vs master)\n" "$abs_diff" "$pct" | tee -a results/profile_comparison.txt
              fi
            done

          else
            python tests/integration_testing/run_workflow.py --yaml tests/integration_testing/integration_test.yml
          fi

          find ./tests/integration_testing/results -mindepth 1 -delete
          mv ./results/* ./tests/integration_testing/results/
          mv ./generated/log_*.txt ./tests/integration_testing/results/ 2>/dev/null || true
      - name: Capture profiler comparison output
        id: profile_comparison
        run: |
          if [[ -f "tests/integration_testing/results/profile_comparison.txt" ]]; then
            content=$(cat tests/integration_testing/results/profile_comparison.txt)
            echo "profile_comparison<<EOF" >> $GITHUB_OUTPUT
            echo "$content" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "profile_comparison=" >> $GITHUB_OUTPUT
          fi
      - name: Compare integration test results
        id: compare
        run: |
          git fetch --depth=1 origin master
          has_diff="false"
          has_json_diff="false"
          has_plot_diff="false"
          changed_plots=""

          # --- JSON comparison: approximate (threshold-based) ---
          # Extract baseline JSONs from master
          mkdir -p tests/integration_testing/base_results
          git show origin/master:tests/integration_testing/results/agg_results.json > tests/integration_testing/base_results/agg_results.json
          git show origin/master:tests/integration_testing/results/ecm_results.json | git lfs smudge > tests/integration_testing/base_results/ecm_results.json
          git show origin/master:tests/integration_testing/results/plots/tech_potential/Summary_Data-TP.xlsx > tests/integration_testing/base_results/Summary_Data-TP.xlsx
          git show origin/master:tests/integration_testing/results/plots/max_adopt_potential/Summary_Data-MAP.xlsx > tests/integration_testing/base_results/Summary_Data-MAP.xlsx

          # Run compare_results.py with a tight threshold (0.0001%) to catch real changes
          # but ignore floating-point platform noise
          python tests/integration_testing/compare_results.py \
            --base-dir tests/integration_testing/base_results \
            --new-dir tests/integration_testing/results \
            --threshold 0.0001

          # Check if any meaningful diffs were reported (csv files with actual content)
          for csv_file in tests/integration_testing/results/*_diffs.csv tests/integration_testing/results/*_key_diffs.csv; do
            if [[ -f "$csv_file" ]]; then
              # File exists = meaningful differences found
              has_json_diff="true"
              has_diff="true"
              break
            fi
          done

          # --- PDF comparison: pixel-level via rendered PNGs ---
          # Install poppler for PDF→PNG conversion
          sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

          plot_diffs_list=""
          while IFS= read -r pdf_file; do
            [[ -z "$pdf_file" ]] && continue
            # Render current PDF to a temp PNG
            new_png=$(mktemp --suffix=.png)
            pdftoppm -png -r 150 -singlefile "$pdf_file" "${new_png%.png}"
            # Render master PDF to a temp PNG
            master_pdf=$(mktemp --suffix=.pdf)
            git show origin/master:"$pdf_file" > "$master_pdf" 2>/dev/null || { rm -f "$new_png" "$master_pdf"; continue; }
            base_png=$(mktemp --suffix=.png)
            pdftoppm -png -r 150 -singlefile "$master_pdf" "${base_png%.png}"
            rm -f "$master_pdf"
            # Compare PNGs pixel-by-pixel using ImageMagick
            ae_count=$(compare -metric AE "$base_png" "$new_png" /dev/null 2>&1 || true)
            if [[ "$ae_count" != "0" ]]; then
              # Pixel differences found — this is a real visual change
              plot_diffs_list="${plot_diffs_list}${pdf_file}"$'\n'
            fi
            rm -f "$new_png" "$base_png"
          done < <(git diff --name-only origin/master -- 'tests/integration_testing/results/plots/' | grep '\.pdf$' || true)

          if [[ -n "$plot_diffs_list" ]]; then
            has_plot_diff="true"
            has_diff="true"
            changed_plots="$plot_diffs_list"
          fi

          echo "has_diff=$has_diff" >> $GITHUB_OUTPUT
          echo "has_json_diff=$has_json_diff" >> $GITHUB_OUTPUT
          echo "has_plot_diff=$has_plot_diff" >> $GITHUB_OUTPUT
          # Use delimiter for multiline output
          echo "changed_plots<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_plots" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Convert changed plot PDFs to PNGs
        if: steps.compare.outputs.has_plot_diff == 'true'
        run: |
          # poppler-utils already installed in compare step
          # Convert new (current) PDFs to PNGs
          mkdir -p tests/integration_testing/results/plot_images
          while IFS= read -r pdf_file; do
            [[ -z "$pdf_file" ]] && continue
            basename=$(basename "$pdf_file" .pdf)
            dirname=$(dirname "$pdf_file")
            rel_path=${dirname#tests/integration_testing/results/plots/}
            mkdir -p "tests/integration_testing/results/plot_images/$rel_path"
            pdftoppm -png -r 150 -singlefile "$pdf_file" "tests/integration_testing/results/plot_images/$rel_path/$basename"
          done <<< "${{ steps.compare.outputs.changed_plots }}"
          # Convert baseline (master) PDFs to PNGs for before/after comparison
          mkdir -p tests/integration_testing/results/base_plot_images
          while IFS= read -r pdf_file; do
            [[ -z "$pdf_file" ]] && continue
            basename=$(basename "$pdf_file" .pdf)
            dirname=$(dirname "$pdf_file")
            rel_path=${dirname#tests/integration_testing/results/plots/}
            mkdir -p "tests/integration_testing/results/base_plot_images/$rel_path"
            # Extract the master version of this PDF into a temp file
            master_pdf=$(mktemp --suffix=.pdf)
            git show origin/master:"$pdf_file" > "$master_pdf" 2>/dev/null || continue
            pdftoppm -png -r 150 -singlefile "$master_pdf" "tests/integration_testing/results/base_plot_images/$rel_path/$basename"
            rm -f "$master_pdf"
          done <<< "${{ steps.compare.outputs.changed_plots }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: ./tests/integration_testing/results/
      - name: Commit integration result updates
        # For PRs with the update-baseline label, commit updated integration
        # results as new baseline files. Otherwise, commit only plot comparison
        # PNGs to support PR comment embedding.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.compare.outputs.has_diff == 'true'
        id: commit_results
        run: |
          UPDATE_BASELINE="${{ steps.check-label.outputs.update_baseline }}"

          if [[ "$UPDATE_BASELINE" == "true" ]]; then
            # Drop transient diff reports before committing new baseline files.
            rm -f ./tests/integration_testing/results/*_diffs.csv
            rm -f ./tests/integration_testing/results/*_key_diffs.csv
            # Guard against generated placeholder files being committed.
            find ./tests/integration_testing/results/plots -type f -name '.gitignore' -delete 2>/dev/null || true

            git add ./tests/integration_testing/results/agg_results.json
            git add ./tests/integration_testing/results/ecm_results.json
            if [[ -d ./tests/integration_testing/results/plots ]]; then
              # Stage plot updates, including deletions of removed placeholder files.
              git add ./tests/integration_testing/results/plots/
            fi
            if [[ -d ./tests/integration_testing/results/plot_images ]]; then
              git add ./tests/integration_testing/results/plot_images/
            fi
            if [[ -d ./tests/integration_testing/results/base_plot_images ]]; then
              git add ./tests/integration_testing/results/base_plot_images/
            fi
            commit_msg="Update integration test baselines from CI"
          else
            # Only commit PNG images for plot diff visualization.
            if [[ -d ./tests/integration_testing/results/plot_images ]]; then
              git add ./tests/integration_testing/results/plot_images/
            fi
            if [[ -d ./tests/integration_testing/results/base_plot_images ]]; then
              git add ./tests/integration_testing/results/base_plot_images/
            fi
            commit_msg="Upload plot comparison images from CI build"
          fi

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No integration result updates to commit"
            exit 0
          fi
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          git commit -m "$commit_msg"

          target_branch="${{ github.head_ref || github.ref_name }}"
          echo "Pushing to branch ${target_branch}"

          # Rebase the generated commit onto the latest remote branch tip in
          # case the PR was updated while CI was running.
          for attempt in 1 2 3; do
            # Some tooling (e.g., filters/LFS) can leave the working tree
            # dirty after commit in CI; rebase requires a clean tree.
            git reset --hard HEAD
            git clean -fd

            git fetch origin "$target_branch"
            if ! git rebase "origin/$target_branch"; then
              echo "Failed to rebase CI baseline update onto origin/${target_branch}"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:"$target_branch"; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Failed to push CI baseline update after 3 attempts"
              exit 1
            fi

            echo "Push rejected; refetching and retrying"
          done

          # Set status checks on the new commit so it inherits parent job statuses
          checks=("code-quality-checks" "Unit Tests (Python 3.10)" "Unit Tests (Python 3.11)" "Unit Tests (Python 3.12)")
          commit_sha=$(git rev-parse HEAD)
          status_url="https://api.github.com/repos/${{ github.repository }}/statuses/$commit_sha"
          for check in "${checks[@]}"; do
            curl -L \
              -X POST \
              $status_url \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -d '{
                "state": "success",
                "context": "'"${check}"'",
                "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }'
          done
          # Mark integration test status based on update-baseline label
          if [[ "$UPDATE_BASELINE" == "true" ]]; then
            integ_state="success"
            integ_desc="Integration results differ from master and baseline was updated"
          else
            integ_state="failure"
            integ_desc="Integration results differ from master"
          fi
          curl -L \
            -X POST \
            $status_url \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{
              "state": "'"${integ_state}"'",
              "context": "integration-tests / Integration Testing",
              "description": "'"${integ_desc}"'",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
      - name: Fail if results differ from master
        if: steps.compare.outputs.has_diff == 'true'
        env:
          UPDATE_BASELINE: ${{ steps.check-label.outputs.update_baseline }}
        run: |
          HAS_JSON_DIFF="${{ steps.compare.outputs.has_json_diff }}"
          HAS_PLOT_DIFF="${{ steps.compare.outputs.has_plot_diff }}"

          # Build a descriptive failure reason
          reasons=""
          if [[ "$HAS_JSON_DIFF" == "true" ]]; then
            reasons="JSON results differ (approximate comparison, 0.0001% threshold)"
          fi
          if [[ "$HAS_PLOT_DIFF" == "true" ]]; then
            if [[ -n "$reasons" ]]; then
              reasons="$reasons; Plot images differ (pixel-level PDF comparison)"
            else
              reasons="Plot images differ (pixel-level PDF comparison)"
            fi
          fi

          if [[ "$UPDATE_BASELINE" == "true" ]]; then
            echo "::warning::Integration test results differ from master, but 'update-baseline' label is set. Treating as expected change."
            echo "::warning::Differences: $reasons"
          else
            echo "::error::Integration test results differ from master: $reasons"
            echo "::notice::To accept these changes as the new baseline, add the 'update-baseline' label to this PR and re-run."
            exit 1
          fi

  # Build a Markdown summary of the integration test run (Ubuntu baseline +
  # cross-platform results, diff details, and before/after plot images) and
  # post it as a comment on the pull request so reviewers can quickly see
  # the current state of the integration tests.
  post-pr-comment:
    name: Post PR Comment
    needs: [run-test, cross-platform-test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Download Ubuntu artifacts
        if: needs.run-test.outputs.has_plot_diff == 'true'
        uses: actions/download-artifact@v4
        with:
          name: results
          path: ./results
      - name: Download cross-platform artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: ./cross-platform-results
      # Assemble the PR comment body: a status table for Ubuntu, a cross-
      # platform results table (Windows/macOS), failure details if applicable,
      # and embedded before/after plot images when plots differ from master.
      # Post it directly as a PR comment.
      - name: Post comment to PR
        uses: actions/github-script@v7
        env:
          HAS_PLOT_DIFF: ${{ needs.run-test.outputs.has_plot_diff }}
          HAS_JSON_DIFF: ${{ needs.run-test.outputs.has_json_diff }}
          HEAD_REF: ${{ github.head_ref }}
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform-test.result }}
          PROFILE_COMPARISON: ${{ needs.run-test.outputs.profile_comparison }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const testResult = '${{ needs.run-test.result }}';
            const hasDiff = '${{ needs.run-test.outputs.has_diff }}';
            const hasJsonDiff = process.env.HAS_JSON_DIFF;
            const hasPlotDiff = process.env.HAS_PLOT_DIFF;
            const headRef = process.env.HEAD_REF;
            const profilerEnabled = '${{ inputs.enable_profiler }}';
            const profileComparison = process.env.PROFILE_COMPARISON || '';
            const crossPlatformResult = process.env.CROSS_PLATFORM_RESULT;
            const statusIcon = testResult === 'success' ? '✅' : (hasDiff === 'true' ? '⚠️' : '❌');

            let body = `## ${statusIcon} Integration Test Results\n\n`;
            body += `### Ubuntu (Baseline)\n`;
            body += `| Item | Detail |\n|---|---|\n`;
            body += `| **Status** | ${testResult} |\n`;
            body += `| **Results changed vs master** | ${hasDiff === 'true' ? 'Yes — review comparison artifacts' : 'No'} |\n`;
            if (hasDiff === 'true') {
              const reasons = [];
              if (hasJsonDiff === 'true') reasons.push('JSON results (approximate comparison, 0.0001% threshold)');
              if (hasPlotDiff === 'true') reasons.push('Plot images (pixel-level PDF comparison)');
              body += `| **What changed** | ${reasons.join('; ')} |\n`;
            }
            body += `| **Profiler** | ${profilerEnabled === 'true' ? 'Enabled' : 'Disabled'} |\n`;
            body += `| **Artifacts & Logs** | [View workflow run](${runUrl}) |\n`;

            // Cross-platform results table
            const crossPlatformDir = './cross-platform-results';
            const platforms = [
              { dir: 'results-windows-latest', display: 'Windows' },
              { dir: 'results-macos-latest', display: 'macOS' }
            ];
            let crossPlatformRows = '';
            for (const { dir, display } of platforms) {
              const statusFile = path.join(crossPlatformDir, dir, 'comparison_status.txt');
              let platformStatus = '❌ Failed';
              let platformDiff = 'N/A';
              if (fs.existsSync(statusFile)) {
                const content = fs.readFileSync(statusFile, 'utf8');
                const hasDiffMatch = content.match(/has_diff=(\w+)/);
                if (hasDiffMatch) {
                  platformDiff = hasDiffMatch[1] === 'true' ? 'Yes' : 'No';
                  platformStatus = hasDiffMatch[1] === 'true' ? '⚠️ Diffs found' : '✅ Pass';
                }
              } else if (crossPlatformResult === 'success') {
                platformStatus = '✅ Pass';
                platformDiff = 'Unknown';
              }
              crossPlatformRows += `| ${display} | ${platformStatus} | ${platformDiff} |\n`;
            }
            body += `\n### Cross-Platform Results\n`;
            body += `| Platform | Status | JSON Diffs vs Master |\n|---|---|---|\n`;
            body += crossPlatformRows;

            // Add failure details section
            if (testResult === 'failure') {
              body += `\n### ❌ Failure Details\n\n`;
              if (hasDiff === 'true') {
                const reasons = [];
                if (hasJsonDiff === 'true') reasons.push('JSON results differ (approximate comparison, 0.0001% threshold)');
                if (hasPlotDiff === 'true') reasons.push('Plot images differ (pixel-level PDF comparison)');
                body += `Integration test results differ from master:\n`;
                for (const reason of reasons) {
                  body += `- ${reason}\n`;
                }
                body += `\nReview the comparison artifacts in the [workflow run](${runUrl}).\n\n`;
                body += `> **To accept these changes:** Add the \`update-baseline\` label to this PR and re-run CI.\n\n`;
              } else {
                body += `The integration test encountered an error. Check the [workflow logs](${runUrl}) for details.\n\n`;
              }
            } else if (testResult === 'cancelled') {
              body += `\n### ⚠️ Cancelled\n\nThe workflow was cancelled before completion. [View run](${runUrl}).\n\n`;
            }

            // Embed before/after plot images if there are plot diffs
            if (hasPlotDiff === 'true') {
              body += `\n### 📊 Changed Plots (Before → After)\n\n`;
              const newImagesDir = './results/plot_images';
              const baseImagesDir = './results/base_plot_images';
              const makeUrl = (repoSubPath) => {
                const encodedPath = repoSubPath.split('/').map(s => encodeURIComponent(s)).join('/');
                return `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${headRef}/${encodedPath}`;
              };
              if (fs.existsSync(newImagesDir)) {
                const walkDir = (dir) => {
                  let files = [];
                  for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                    const fullPath = path.join(dir, entry.name);
                    if (entry.isDirectory()) {
                      files = files.concat(walkDir(fullPath));
                    } else if (entry.name.endsWith('.png')) {
                      files.push(fullPath);
                    }
                  }
                  return files;
                };
                const pngFiles = walkDir(newImagesDir).sort();
                for (const pngFile of pngFiles) {
                  const relPath = path.relative(newImagesDir, pngFile);
                  const plotName = path.basename(pngFile, '.png');
                  const newRepoPath = `tests/integration_testing/results/plot_images/${relPath}`;
                  const baseRepoPath = `tests/integration_testing/results/base_plot_images/${relPath}`;
                  const newUrl = makeUrl(newRepoPath);
                  const baseUrl = makeUrl(baseRepoPath);
                  const displayName = relPath.endsWith('.png') ? relPath.slice(0, -4) : relPath;
                  const hasBase = fs.existsSync(path.join(baseImagesDir, relPath));
                  body += `<details><summary><b>${displayName}</b></summary>\n\n`;
                  body += `| Master (before) | PR (after) |\n|---|---|\n`;
                  if (hasBase) {
                    body += `| ![before](${baseUrl}) | ![after](${newUrl}) |\n`;
                  } else {
                    body += `| _(new plot)_ | ![after](${newUrl}) |\n`;
                  }
                  body += `\n</details>\n\n`;
                }
              }
            }

            // Embed profiler comparison if enabled
            if (profilerEnabled === 'true' && profileComparison) {
              body += `\n### ⏱️ Profiler Comparison (Feature vs Master)\n\n`;
              body += `| Step | Master (s) | Feature (s) | Δ Time (s) | Improvement |\n`;
              body += `|---|---|---|---|---|\n`;
              // Parse lines like:
              //   --- Step: ecm_prep ---
              //   Master  elapsed time: 485.18s
              //   Feature elapsed time: 460.00s
              //   Δ Time: 25.18s (5.19% improvement in feature vs master)
              const stepBlocks = profileComparison.split(/--- Step: (\w+) ---/).slice(1);
              for (let i = 0; i < stepBlocks.length; i += 2) {
                const stepName = stepBlocks[i].trim();
                const block = stepBlocks[i + 1] || '';
                const mMatch = block.match(/Master\s+elapsed time:\s+([\d.]+)s/);
                const fMatch = block.match(/Feature\s+elapsed time:\s+([\d.]+)s/);
                const dMatch = block.match(/Δ Time:\s+([-\d.]+)s\s+\(([-\d.]+)%/);
                const mTime = mMatch ? mMatch[1] : 'N/A';
                const fTime = fMatch ? fMatch[1] : 'N/A';
                const absDiff = dMatch ? dMatch[1] : 'N/A';
                const pct = dMatch ? dMatch[2] : 'N/A';
                const icon = dMatch ? (parseFloat(dMatch[2]) > 0.005 ? '✅' : '⚠️') : '';
                body += `| \`${stepName}\` | ${mTime} | ${fTime} | ${absDiff} | ${icon} ${pct}% |\n`;
              }
              body += `\n<details><summary>Full profiler output</summary>\n\n`;
              body += `\`\`\`\n${profileComparison}\n\`\`\`\n\n</details>\n\n`;
              body += `_Full memory logs and cProfile CSVs are in the [workflow artifacts](${runUrl})._\n\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  cross-platform-test:
    name: Integration Testing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/constraints.txt ".[dev]"
      - name: Run integration test
        env:
          SOURCE_DATE_EPOCH: '0'
        run: python tests/integration_testing/run_workflow.py --yaml tests/integration_testing/integration_test.yml
      - name: Move results
        shell: bash
        run: |
          find ./tests/integration_testing/results -mindepth 1 -delete
          mv ./results/* ./tests/integration_testing/results/
          mv ./generated/log_*.txt ./tests/integration_testing/results/ 2>/dev/null || true
      - name: Compare results against master
        id: compare
        shell: bash
        run: |
          git fetch --depth=1 origin master
          has_diff="false"

          # --- JSON comparison: approximate (threshold-based) ---
          mkdir -p tests/integration_testing/base_results
          git show origin/master:tests/integration_testing/results/agg_results.json > tests/integration_testing/base_results/agg_results.json
          git show origin/master:tests/integration_testing/results/ecm_results.json | git lfs smudge > tests/integration_testing/base_results/ecm_results.json
          git show origin/master:tests/integration_testing/results/plots/tech_potential/Summary_Data-TP.xlsx > tests/integration_testing/base_results/Summary_Data-TP.xlsx
          git show origin/master:tests/integration_testing/results/plots/max_adopt_potential/Summary_Data-MAP.xlsx > tests/integration_testing/base_results/Summary_Data-MAP.xlsx

          python tests/integration_testing/compare_results.py \
            --base-dir tests/integration_testing/base_results \
            --new-dir tests/integration_testing/results \
            --threshold 0.0001

          for csv_file in tests/integration_testing/results/*_diffs.csv tests/integration_testing/results/*_key_diffs.csv; do
            if [[ -f "$csv_file" ]]; then
              has_diff="true"
              break
            fi
          done

          # Write status file for PR comment aggregation
          echo "has_diff=$has_diff" > tests/integration_testing/results/comparison_status.txt
          echo "platform=${{ matrix.os }}" >> tests/integration_testing/results/comparison_status.txt
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: ./tests/integration_testing/results/
